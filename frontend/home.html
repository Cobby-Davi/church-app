<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="register-container">
    <h1>Welcome!</h1>
    <p class="subtitle" id="welcomeMessage">Loading...</p>
  </div>

  <script>
    const currentMember = JSON.parse(localStorage.getItem('currentMember'));
    if (currentMember) {
      document.getElementById('welcomeMessage').textContent = 'Hello, ' + currentMember.name + '!';
    }
  </script>

</body>
</html>

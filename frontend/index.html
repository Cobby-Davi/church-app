<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a1b7a"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="photo-bg bg-welcome">
  

  <div class="register-container">
    <img src="logo.jpeg" alt="IHIL Church International logo" class="logo">
    <div class="brand">In Him Is Life Church International</div>
    <h1>Create your account</h1>
    <p class="subtitle">Join our church family online</p>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

      <label for="birthday">Birthday</label>
      <input type="date" id="birthday" name="birthday" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Create a password">

      <button type="submit">Register</button>
    </form>

    <p id="statusMessage"></p>

    <p class="subtitle" style="margin:18px 0 0;">
      Already a member? <a href="login.html">Login</a>
    </p>
  </div>

  <script type="module" src="script.js"></script>
<script src="register-sw.js"></script></body>
</html>

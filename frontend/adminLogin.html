<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a1b7a"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="photo-bg bg-welcome">
  <div class="register-container">
    <img src="logo.jpeg" alt="IHIL Church International logo" class="logo">
    <div class="brand">In Him Is Life Church International</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Authorised leaders only</p>

    <form id="adminLoginForm">
      <label for="adminPassword">Admin Password</label>
      <input type="password" id="adminPassword" required autocomplete="off" placeholder="Enter admin password">

      <button type="submit">Login</button>
    </form>

    <p id="statusMessage"></p>
  </div>

  <script src="adminLogin.js"></script>
<script src="register-sw.js"></script></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      width: 500px;
    }
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .member-info {
      font-size: 14px;
    }
    .member-actions button {
      margin-left: 5px;
      padding: 6px 10px;
      font-size: 12px;
      width: auto;
    }
    .approve-btn { background-color: #27ae60; }
    .reject-btn { background-color: #c0392b; }
  </style>
</head>
<body>

  <div class="register-container admin-container">
    <h1>Admin Dashboard</h1>
    <p class="subtitle">Pending Member Approvals</p>

    <div id="pendingList"></div>
    <hr style="margin:20px 0;">

    <h2 style="font-size:16px;">Post an Announcement</h2>
    <form id="announcementForm">
      <label for="annTitle">Title</label>
      <input type="text" id="annTitle" required placeholder="e.g. Sunday Service Update">

      <label for="annMessage">Message</label>
      <input type="text" id="annMessage" required placeholder="Write your announcement">

      <button type="submit">Post</button>
    </form>

    <p id="statusMessage"></p>
  </div>
    <hr style="margin:20px 0;">

    <h2 style="font-size:16px;">Post a Sermon</h2>
    <form id="sermonForm">
      <label for="sermonTitle">Title</label>
      <input type="text" id="sermonTitle" required placeholder="e.g. Walking in Faith">

      <label for="sermonSpeaker">Speaker</label>
      <input type="text" id="sermonSpeaker" required placeholder="e.g. Pastor John">

      <label for="sermonNotes">Notes</label>
      <input type="text" id="sermonNotes" required placeholder="Short summary or notes">

      <button type="submit">Post Sermon</button>
    </form>
  <script src="admin.js"></script>
</body>
</html>

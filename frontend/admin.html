<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a1b7a"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="photo-bg bg-admin">

  <div class="register-container admin-container">
    <img src="logo.jpeg" alt="IHIL Church International logo" class="logo-sm">
    <div class="brand">In Him Is Life Church International</div>
    <h1>Admin Dashboard</h1>
    <p class="subtitle">Manage members and church content</p>

    <h2>Pending Member Approvals</h2>
    <div id="pendingList"></div>

    <hr>

    <h2>Post an Announcement</h2>
    <form id="announcementForm">
      <label for="annTitle">Title</label>
      <input type="text" id="annTitle" required placeholder="e.g. Sunday Service Update">

      <label for="annMessage">Message</label>
      <input type="text" id="annMessage" required placeholder="Write your announcement">

      <button type="submit">Post</button>
    </form>

    <hr>

    <h2>Post a Sermon</h2>
    <form id="sermonForm">
      <label for="sermonTitle">Title</label>
      <input type="text" id="sermonTitle" required placeholder="e.g. Walking in Faith">

      <label for="sermonSpeaker">Speaker</label>
      <input type="text" id="sermonSpeaker" required placeholder="e.g. Pastor John">

      <label for="sermonNotes">Notes</label>
      <input type="text" id="sermonNotes" required placeholder="Short summary or notes">

      <button type="submit">Post Sermon</button>
    </form>

    <hr>

    <h2>Schedule a Devotion</h2>
    <form id="devotionForm">
      <label for="devDate">Date</label>
      <input type="date" id="devDate" required>

      <label for="devRef">Bible Reference</label>
      <input type="text" id="devRef" required autocomplete="off" placeholder="e.g. Psalm 23:1 or John 3:16">

      <button type="submit">Schedule</button>
    </form>

    <hr>

    <h2>Mark Attendance</h2>
    <label for="attendanceDate">Service Date</label>
    <input type="date" id="attendanceDate">

    <div id="memberChecklist" style="margin-top:12px; font-size:14px; text-align:left;"></div>

    <button id="saveAttendanceBtn">Save Attendance</button>

    <hr>

    <h2>Add Member Manually</h2>
    <form id="addMemberForm">
      <label for="newName">Full Name</label>
      <input type="text" id="newName" required>

      <label for="newPhone">Phone Number</label>
      <input type="tel" id="newPhone" required>

      <label for="newBirthday">Birthday</label>
      <input type="date" id="newBirthday" required>

      <label for="newPassword">Password</label>
      <input type="text" id="newPassword" required>

      <button type="submit">Add as Active Member</button>
    </form>

    <hr>

    <h2>All Members</h2>
    <div id="allMembersList"></div>

    <hr>

    <h2>Update Live Stream Links</h2>
    <form id="liveLinksForm">
      <label for="facebookLink">Facebook Live Link</label>
      <input type="url" id="facebookLink" placeholder="https://facebook.com/...">

      <label for="zoomLink">Zoom Link</label>
      <input type="url" id="zoomLink" placeholder="https://zoom.us/...">

      <button type="submit">Save Links</button>
    </form>

    <p id="statusMessage"></p>
  </div>

  <script type="module" src="admin.js"></script>
<script src="register-sw.js"></script></body>
</html>

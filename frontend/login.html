<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a1b7a"><link rel="apple-touch-icon" href="icon-192.png">
</head>
	<body class="photo-bg bg-welcome">

  <div class="register-container">
    <img src="logo.jpeg" alt="IHIL Church International logo" class="logo">
    <div class="brand">In Him Is Life Church International</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Login to your member account</p>

    <form id="loginForm">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">

      <button type="submit">Login</button>
    </form>

    <p id="statusMessage"></p>

    <p class="subtitle" style="margin:18px 0 0;">
      New here? <a href="index.html">Register</a>
    </p>
  </div>

  <script type="module" src="login.js"></script>
<script src="register-sw.js"></script></body>
</html>

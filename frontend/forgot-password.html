<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - In Him Is Life Church International</title>
  <link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a1b7a"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="photo-bg bg-welcome">

  <div class="register-container">
    <img src="logo.jpeg" alt="IHIL Church International logo" class="logo-sm">
    <div class="brand">In Him Is Life Church International</div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Send your details to the church admin and we'll help you get back in.</p>

    <form id="forgotForm">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" required placeholder="Your full name">

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" required placeholder="The number you registered with">

      <button type="submit">💬 Message the admin on WhatsApp</button>
    </form>

    <p class="subtitle" style="margin:16px 0 0;">Or call: <a id="callLink" href="#"></a></p>
    <p class="subtitle" style="margin:18px 0 0;"><a href="login.html">&larr; Back to login</a></p>
  </div>

  <script src="forgot-password.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
